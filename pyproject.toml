[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.back-end"

[project]
name = "multi-agent-requirement-system"
version = "1.0.0"
description = "多 Agent 协作需求拆解系统 - 将一句话需求自动拆解为完整技术方案"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
multi-agent-cli = "multi_agent_system.pipeline:main"
web-app = "multi_agent_system.web_app:main"

[tool.setuptools.packages.find]
include = ["multi_agent_system*"]
